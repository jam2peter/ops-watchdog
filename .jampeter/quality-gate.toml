version = 1
profile = "ops-watchdog-python"

[report]
path = ".quality-gate/report.json"

[[gate]]
id = "compile"
phase = "type"
command = "python3 -m compileall -q src tests"
required = true

[[gate]]
id = "tests"
phase = "test"
command = "python3 -m unittest discover -s tests -v"
required = true

[[gate]]
id = "examples-json"
phase = "lint"
command = "python3 -c \"import json; [json.load(open(p,encoding='utf-8')) for p in ('examples/audit-snapshot.json','examples/monitor-snapshot.json')]\""
required = true
